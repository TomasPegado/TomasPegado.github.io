    Summary:
      - bullet: Master's student in Computer Science at PUC-Rio and full-time researcher at TecGraf, with research interests in generative artificial intelligence, natural language processing, and natural-language interfaces to structured data. I completed my B.Sc. in Computer Science at PUC-Rio in July 2026, developing an undergraduate thesis on the systematic evaluation of conversational text-to-SQL agents, with results published in co-authored papers. At TecGraf I build production language-model systems for large corporate clients. In the Master's I am deepening evaluation methods and information retrieval over structured databases mediated by LLMs.

